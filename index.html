<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Product Inventory Manager</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    form { display: grid; gap: .5rem; margin-bottom: 1rem; }
    li { display: flex; justify-content: space-between; padding: .4rem 0; border-bottom: 1px solid #ddd; }
    .out { color: #b00020; }
  </style>
</head>
<body>
  <h1>Product Inventory Manager</h1>
  <form id="product-form">
    <input id="name" placeholder="Product name" required />
    <input id="price" type="number" step="0.01" placeholder="Price" required />
    <input id="tags" placeholder="Tags (comma separated)" />
    <label><input id="inStock" type="checkbox" checked /> In stock</label>
    <button type="submit">Add product</button>
  </form>
  <label><input id="filter" type="checkbox" /> Show only in-stock</label>
  <ul id="list"></ul>
  <script type="module" src="dist/app.js"></script>
</body>
</html>
